<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Honkai Star Rail cyan-blue neon gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cbe6ff" />
      <stop offset="100%" stop-color="#4ba3f0" />
    </linearGradient>

    <!-- Soft outer glow filter mimicking the in-game UI element -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark backdrop layer removed for absolute transparency -->

  <g filter="url(#glow)" transform="translate(250, 250)">
    <!-- Primary Crescent Moon Silhouette Base -->
    <path d="M 0,-160 
             A 160,160 0 1,0 120,105 
             A 140,140 0 0,1 -40,-90
             A 150,150 0 0,1 0,-160 Z" fill="none" stroke="url(#moonGrad)" stroke-width="5.5"
      stroke-linejoin="round" />

    <!-- Outer Frame Rim -->
    <path d="M 0,-160 A 160,160 0 1,0 120,105" fill="none" stroke="url(#moonGrad)" stroke-width="4.5" />

    <!-- Inner Frame Rim -->
    <path d="M 0,-160 A 125,125 0 0,0 -125,0 A 125,125 0 0,0 60,110" fill="none" stroke="url(#moonGrad)"
      stroke-width="4.5" />

    <!-- Geometric Interlocking Lattice Pattern (Excludes Clock Elements) -->
    <!-- Outer structural intersections -->
    <line x1="0" y1="-160" x2="-88" y2="-88" stroke="url(#moonGrad)" stroke-width="2.5" />
    <line x1="-88" y1="-88" x2="-125" y2="0" stroke="url(#moonGrad)" stroke-width="2.5" />
    <line x1="-125" y1="0" x2="-88" y2="88" stroke="url(#moonGrad)" stroke-width="2.5" />
    <line x1="-88" y1="88" x2="60" y2="110" stroke="url(#moonGrad)" stroke-width="2.5" />

    <!-- Diamond bracing matrix lines -->
    <path d="M 0,-160 L -60,-110 L -125,0 L -60,110 L 60,110" fill="none" stroke="url(#moonGrad)" stroke-width="2" />
    <path d="M -45,-115 L -100,-60 L -100,60 L -30,105" fill="none" stroke="url(#moonGrad)" stroke-width="2" />

    <!-- Secondary reinforcing web brackets -->
    <line x1="-45" y1="-115" x2="-88" y2="-88" stroke="url(#moonGrad)" stroke-width="1.5" />
    <line x1="-100" y1="-60" x2="-125" y2="0" stroke="url(#moonGrad)" stroke-width="1.5" />
    <line x1="-100" y1="60" x2="-88" y2="88" stroke="url(#moonGrad)" stroke-width="1.5" />
    <line x1="-30" y1="105" x2="10" y2="118" stroke="url(#moonGrad)" stroke-width="1.5" />

    <!-- Deep internal concentric alignment arc -->
    <path d="M -25,-140 A 142,142 0 0,0 -142,0 A 142,142 0 0,0 90,110" fill="none" stroke="url(#moonGrad)"
      stroke-width="1.5" stroke-dasharray="6,4" />
  </g>
</svg>
